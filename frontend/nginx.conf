server {
  listen       80;
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # 旧链接兼容：原 enroll.html / picker.html 已合并进 PPT 弹窗
  location = /enroll.html { return 301 /#enroll; }
  location = /picker.html { return 301 /#pick; }

  # 静态资源缓存（HTML 不缓存，方便迭代）
  location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # 反向代理 → backend 容器
  location /api/ {
    proxy_pass         http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  # 健康检查也代理过去（方便调试）
  location = /healthz { proxy_pass http://backend:3000/healthz; }
  location = /readyz  { proxy_pass http://backend:3000/readyz; }

  # 安全相关 header
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;
}
